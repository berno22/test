<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starlite Live</title>
    <link href="https://vjs.zencdn.net/7.15.4/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/7.15.4/video.min.js"></script>
    <style>
      :root {
        --bg: #e8e8e8;
        --surface: #ffffff;
        --text: #1a1a1a;
        --muted: #777777;
        --line: #d0d0d0;
        --accent: #e82127;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        color-scheme: light;
      }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        font-weight: 300;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      @media(min-width:700px) and (max-width:840px){
        html{zoom:0.6}
      }

      header {
        width: 100%;
        padding: 28px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        font-size: 20px;
        letter-spacing: 6px;
        text-transform: uppercase;
        font-weight: 500;
      }
      .brand .dot {
        color: var(--accent);
      }
      header .right {
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .all-media {
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
        transition: color 0.2s;
      }
      .all-media:hover {
        color: var(--text);
      }
      .live-badge {
        display: none;
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--accent);
      }
      .live-badge .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        margin-right: 8px;
        animation: blink 2s infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }

      main {
        width: 100%;
        max-width: 1200px;
        padding: 20px 40px 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #myPlayer {
        display: none;
        width: min(960px, 60vw);
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 48px;
      }
      #myPlayer.vjs-fluid {
        display: block;
      }
      .video-js .vjs-control-bar {
        font-size: 16px;
      }

      .section-title {
        font-size: 13px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 28px;
      }

      .channel-grid {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
        gap: 14px;
        justify-items: center;
      }
      .channel {
        display: flex;
        align-items: center;
        cursor: pointer;
        opacity: 0.5;
        transition: opacity 0.25s ease;
      }
      .channel:hover {
        opacity: 1;
      }
      .channel img {
        width: 46px;
        height: 46px;
        object-fit: contain;
        transition: transform 0.25s ease;
        filter: grayscale(100%);
        opacity: 0.9;
      }
      .channel.selected {
        opacity: 1;
      }
      .channel.selected img {
        transform: scale(1.2);
        filter: grayscale(0%);
      }

      .video-js .vjs-big-play-button {
        border: none;
        line-height: 1;
        height: 1.5em;
        border-radius: 100%;
      }
    </style>
  </head>
  <body>

    <header>
      <div class="brand">Starlite<span class="dot">&bull;</span></div>
      <div class="right">
        <a class="all-media" href="https://berno22.github.io/">All Media</a>
        <span id="liveBadge" class="live-badge"><span class="dot"></span>Live</span>
      </div>
    </header>

    <main>
      <video id="myPlayer" class="video-js" controls></video>

      <h1 class="section-title">Channels</h1>
      <div id="channelGrid" class="channel-grid"></div>
    </main>

    <script>
      var selected = null;
      var baseUrl1 = 'https://starlite.';
      var baseUrl2 = 'best/api/stream/';
      var baseUrl3 = 'ddo';
      var baseUrl4 = '514';
      var baseUrl5 = '2011';
      var baseUrl6 = '/2';
      var baseUrl7 = '+{KwUO8:5$41m';
      var baseUrl8 = '/livetv.epg/';
      var player = videojs('myPlayer');

      function loadChannel(channel) {
        var url = baseUrl1 + baseUrl2 + baseUrl3 + baseUrl4 + baseUrl5 + baseUrl6 + baseUrl7 + baseUrl8 + channel + '.m3u8';
        var video = document.getElementById("myPlayer");
        video.style.display = "block";
        video.classList.add("vjs-fluid");
        document.getElementById("liveBadge").style.display = "inline-block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
        player.src({ src: url, type: 'application/x-mpegURL' });
        player.play();
      }

      function closeFrame() {
        var video = document.getElementById("myPlayer");
        player.pause();
        player.src("");
        video.style.display = "none";
        video.classList.remove("vjs-fluid");
        document.getElementById("liveBadge").style.display = "none";
      }

      function selectChannel(el, name) {
        if (selected) selected.classList.remove("selected");
        selected = el;
        el.classList.add("selected");
        loadChannel(name);
      }

      async function loadChannels() {
        const channels = await (await fetch('channels.json')).json();
        const grid = document.getElementById('channelGrid');

        channels.forEach(channel => {
          const name = channel.name;
          const logo = channel.logo;

          const divider = document.createElement('div');
          divider.className = 'channel';
          divider.onclick = () => selectChannel(divider, name);

          const img = document.createElement('img');
          img.loading = 'lazy';
          img.alt = name;
          img.src = logo || `https://media.starlite.best/${name}.png`;

          divider.appendChild(img);
          grid.appendChild(divider);
        });
      }

      loadChannels();
    </script>
  </body>
</html>
